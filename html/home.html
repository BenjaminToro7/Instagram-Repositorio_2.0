<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/home.css">
</head>
<body>
    <div class="container">
        <main class="content">
            <section class="stories">
                <div class="story">
                    <div class="story-avatar">
                        <img src="../imgs-matemagia/foto-perfil.png" alt="matemagia">
                    </div>
                    <span class="story-username">matemagia</span>
                </div>
                <div class="story">
                    <div class="story-avatar">
                        <img src="../imgs-m30m/m30m.jpg" alt="m30m">
                    </div>
                    <span class="story-username">m30m</span>
                </div>
                <div class="story">
                    <div class="story-avatar">
                        <img src="https://i.pravatar.cc/60?img=3" alt="avatar">
                    </div>
                    <span class="story-username">usuario3</span>
                </div>
                <div class="story">
                    <div class="story-avatar">
                        <img src="https://i.pravatar.cc/60?img=4" alt="avatar">
                    </div>
                    <span class="story-username">usuario4</span>
                </div>
                <div class="story">
                    <div class="story-avatar">
                        <img src="https://i.pravatar.cc/60?img=5" alt="avatar">
                    </div>
                    <span class="story-username">usuario5</span>
                </div>
                <div class="story">
                    <div class="story-avatar">
                        <img src="https://i.pravatar.cc/60?img=6" alt="avatar">
                    </div>
                    <span class="story-username">usuario6</span>
                </div>
                <div class="story">
                    <div class="story-avatar">
                        <img src="https://i.pravatar.cc/60?img=7" alt="avatar">
                    </div>
                    <span class="story-username">usuario7</span>
                </div>
                <div class="story">
                    <div class="story-avatar">
                        <img src="https://i.pravatar.cc/60?img=8" alt="avatar">
                    </div>
                    <span class="story-username">usuario8</span>
                </div>
            </section>
        </main>

        <aside class="sidebar">
            <div class="sidebar-icons">
                <div class="sidebar-top">
                    <button class="sidebar-btn" id="btn-logo" title="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </button>
                    <button class="sidebar-btn" id="btn-home" title="Inicio">
                        <i class="fa-solid fa-house"></i>
                    </button>
                    <button class="sidebar-btn" id="btn-reels" title="Reels">
                        <i class="fa-solid fa-clapperboard"></i>
                    </button>
                    <button class="sidebar-btn" id="btn-messages" title="Mensajes">
                        <i class="fa-regular fa-paper-plane"></i>
                    </button>
                    <button class="sidebar-btn" id="btn-heart" title="Notificaciones">
                        <i class="fa-regular fa-heart"></i>
                    </button>
                    <button class="sidebar-btn" id="btn-plus" title="Crear">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
                <div class="sidebar-bottom">
                    <button class="sidebar-btn" id="btn-profile" title="Perfil">
                        <img src="https://i.pravatar.cc/60?img=10" alt="Profile" class="profile-pic">
                    </button>
                    <button class="sidebar-btn" id="btn-settings" title="Configuración">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                </div>
            </div>
        </aside>
    </div>

    <script src="../js/home.js"></script>
</body>
</html>
