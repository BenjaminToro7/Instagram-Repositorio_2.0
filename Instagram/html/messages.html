<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram - Mensajes</title>
  <link rel="stylesheet" href="../css/messages.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

  <!-- BARRA LATERAL IZQUIERDA -->
  <nav class="sidebar">
    <div class="logo">
      <i class="fa-brands fa-instagram"></i>
    </div>
    <div class="menu">
      <a href="home.html"><i class="fa-solid fa-house"></i></a>
      <a href="search.html"><i class="fa-solid fa-magnifying-glass"></i></a>
      <a href="reels.html"><i class="fa-solid fa-clapperboard"></i></a>
      <a href="messages.html" class="activo"><i class="fa-solid fa-paper-plane"></i></a>
      <a href="notifications.html"><i class="fa-regular fa-heart"></i></a>
      <a href="profile.html"><i class="fa-regular fa-user"></i></a>
    </div>
    <div class="menuInferior">
      <i class="fa-solid fa-bars"></i>
    </div>
  </nav>

  <!-- PANEL DE CHATS -->
  <aside class="panelChats">
    <div class="usuarioActual">
      <h2 id="nombreUsuarioActual">Usuario</h2>
      <i class="fa-regular fa-pen-to-square"></i>
    </div>

    <div class="busqueda">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="buscar" placeholder="Buscar">
    </div>

    <div class="notas">
      <div id="listaNotas"></div>
    </div>

    <div class="tituloChats">
      <h3>Mensajes</h3>
      <a href="#">Solicitudes</a>
    </div>

    <div id="listaChats"></div>
  </aside>

  <!-- CONVERSACIÓN PRINCIPAL -->
  <section class="conversacion">
    <header class="headerChat">
      <div class="infoChat">
        <img id="fotoUsuario" alt="">
        <div>
          <h3 id="nombreChat">Tus mensajes</h3>
          <p id="estadoUsuario">Selecciona una conversación</p>
        </div>
      </div>
      <div class="accionesChat">
        <i class="fa-solid fa-phone"></i>
        <i class="fa-solid fa-video"></i>
        <i class="fa-solid fa-circle-info"></i>
      </div>
    </header>

    <div id="contenedorMensajes">
      <div class="mensajeInicio">
        <div class="circulo">
          <i class="fa-regular fa-paper-plane"></i>
        </div>
        <h2>Tus mensajes</h2>
        <p>Envía fotos y mensajes privados a un amigo o un grupo.</p>
        <button>Enviar mensaje</button>
      </div>
    </div>

    <div class="enviarMensaje">
      <input type="text" id="inputMensaje" placeholder="Mensaje...">
      <button id="btnEnviar">Enviar</button>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="../js/mensajes.js"></script>
</body>
</html>
