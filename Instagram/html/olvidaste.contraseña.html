<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="../css/contraseña.css">
</head>
<body>

    <div class="container">

        <div class="card">


            <h1 class="logo">Instagram</h1>

            <h2>¿Tienes problemas para iniciar sesión?</h2>

            <p>
                Ingresa tu correo electrónico o nombre de usuario y te enviaremos un enlace para recuperar tu cuenta.
            </p>

            <form>
                <input
                    type="text"
                    placeholder="Correo electrónico o usuario"
                    required
                >

                <button type="submit">
                    Enviar enlace
                </button>
            </form>

            <hr>

            <a href="register.html" class="register-link">
                Crear cuenta nueva
            </a>

        </div>

        <div class="back-login">
            <a href="index.html">
                Volver al inicio de sesión
            </a>
        </div>

    </div>

</body>
</html>
