<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram – Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/index.css">
</head>
<body>
  <div class="page-wrapper">
    <!-- Panel izquierdo: mockup de teléfono -->
    <div class="left-panel">
      <div class="phone-mockup">
        <div class="phone-screen">
          <div class="phone-feed">
            <div class="phone-header"><span class="phone-logo">Instagram</span></div>
            <div class="phone-stories"></div>
            <div class="phone-post"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Panel derecho: formulario de login -->
    <div class="right-panel">
      <div class="login-card">
        <h1 class="logo">Instagram</h1>
        <form id="loginForm">
          <div class="form-group">
            <input type="text" id="email" class="input-field" placeholder="Email o nombre de usuario" required>
          </div>
          <div class="form-group password-wrapper">
            <input type="password" id="password" class="input-field" placeholder="Contraseña" required>
            <span class="toggle-password" data-target="password">
              <i class="fa-regular fa-eye-slash"></i>
            </span>
          </div>
          <button type="submit" class="btn-primary">Iniciar sesión</button>
          <div id="loginError" class="error-msg"></div>
        </form>
        <div class="separator"><span class="line"></span><span class="or-text">O</span><span class="line"></span></div>
        <a href="register.html" class="forgot-password">¿No tienes cuenta? Regístrate</a>
      </div>
      <div class="app-badges">
        <p>Descarga la aplicación.</p>
        <div class="badges-row">
          <button class="badge" onclick="window.open('https://apps.apple.com/app/instagram/id389801252','_blank')">App Store</button>
          <button class="badge" onclick="window.open('https://play.google.com/store/apps/details?id=com.instagram.android','_blank')">Google Play</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="../js/toggle-password.js"></script>
  <script src="../js/index.js"></script>
</body>
</html>
