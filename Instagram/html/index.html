<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram – Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/index.css">
</head>
<body>
  <div class="page-wrapper">
    <!-- Panel izquierdo: mockup de teléfono -->
    <div class="left-panel">
      <div class="phone-mockup">
        <div class="phone-screen">
          <div class="phone-feed">
            <!-- Header del teléfono -->
            <div class="phone-header">
              <span class="phone-logo">Instagram</span>
              <div class="phone-icons">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2"><polyline points="18 8 22 12 18 16"></polyline><polyline points="6 8 2 12 6 16"></polyline><line x1="2" y1="12" x2="22" y2="12"></line></svg>
              </div>
            </div>

            <!-- Stories circulares -->
            <div class="phone-stories">
              <div class="story-bubble"><div class="story-avatar a1"></div></div>
              <div class="story-bubble"><div class="story-avatar a2"></div></div>
              <div class="story-bubble"><div class="story-avatar a3"></div></div>
              <div class="story-bubble"><div class="story-avatar a4"></div></div>
            </div>

            <!-- Publicación de ejemplo -->
            <div class="phone-post">
              <div class="post-header">
                <div class="post-avatar"></div>
                <span class="post-user">searchmatchgroup</span>
                <svg class="post-more" width="16" height="16" viewBox="0 0 24 24" fill="#262626"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
              </div>
              <div class="post-image"></div>
              <div class="post-actions">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2"><path d="M20.8 11.5a7.5 7.5 0 0 0-14.2-3.5A7.5 7.5 0 0 0 3.2 16l-1.2 5 5-1.2a7.5 7.5 0 0 0 3.5 1.2"/><circle cx="18" cy="18" r="4"/><line x1="18" y1="16" x2="18" y2="20"/><line x1="16" y1="18" x2="20" y2="18"/></svg>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2"/><circle cx="12" cy="12" r="3"/><circle cx="16.5" cy="7.5" r="1.5"/></svg>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- PANEL DERECHO: Formulario de inicio de sesión -->
    <div class="right-panel">
      <div class="login-card">
        <!-- Logo -->
        <h1 class="logo">Instagram</h1>

        <!-- Botón Facebook -->
        <button class="btn-social btn-facebook" onclick="window.open('https://www.facebook.com','_blank')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Iniciar sesión con Facebook
        </button>

        <!-- Botón Google -->
        <button class="btn-social btn-google" onclick="window.open('https://accounts.google.com','_blank')">
          <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.54 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.99 23.99 0 0 0 0 24c0 3.77.87 7.35 2.56 10.56l7.98-5.97z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 5.97C6.51 42.62 14.62 48 24 48z"/></svg>
          Iniciar sesión con Google
        </button>

        <!-- Separador O -->
        <div class="separator">
          <span class="line"></span>
          <span class="or-text">O</span>
          <span class="line"></span>
        </div>

        <!-- Formulario -->
        <form id="loginForm" novalidate>

          <div class="form-group">
            <input type="text" id="login-email" class="input-field" placeholder="Nombre de usuario o correo electrónico"
                   data-validate="email" autocomplete="username" />
            <span class="error-msg"></span>
          </div>

          <div class="form-group password-wrapper">
            <input type="password" id="login-password" class="input-field" placeholder="Contraseña"
                   data-validate="password" autocomplete="current-password" />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
              <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
            <span class="error-msg"></span>
          </div>

          <button type="submit" class="btn-primary" id="btn-login" disabled>
            Iniciar sesión
          </button>

        </form>

        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Caja de registro -->
      <div class="register-card">
        <p>
          ¿No tienes una cuenta?
          <a href="register.html" class="link-login">Regístrate</a>
        </p>
      </div>

      <!-- App store badges -->
      <div class="app-badges">
        <p>Descarga la aplicación.</p>
        <div class="badges-row">
          <button class="badge" onclick="window.open('https://apps.apple.com/app/instagram/id389801252','_blank')">App Store</button>
          <button class="badge" onclick="window.open('https://play.google.com/store/apps/details?id=com.instagram.android','_blank')">Google Play</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="../js/toggle-password.js"></script>
  <script src="../js/index.js"></script>
</body>
</html>
