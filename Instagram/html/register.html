<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram – Registrarse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/register.css">
</head>
<body>
  <div class="page-wrapper">
    <div class="left-panel">
      <div class="phone-mockup">
        <div class="phone-screen">
          <div class="phone-feed">
            <div class="phone-header"><span class="phone-logo">Instagram</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="right-panel">
      <div class="register-card">
        <h1 class="logo">Instagram</h1>
        <p class="subtitle">Regístrate para ver fotos y videos de tus amigos.</p>
        <form id="registerForm">
          <div class="form-group">
            <input type="text" id="username" class="input-field" placeholder="Nombre de usuario" required>
          </div>
          <div class="form-group">
            <input type="email" id="email" class="input-field" placeholder="Correo electrónico" required>
          </div>
          <div class="form-group password-wrapper">
            <input type="password" id="password" class="input-field" placeholder="Contraseña" required>
            <span class="toggle-password" data-target="password">
              <i class="fa-regular fa-eye-slash"></i>
            </span>
          </div>
          <div class="form-group password-wrapper">
            <input type="password" id="confirm-password" class="input-field" placeholder="Confirmar contraseña" required>
            <span class="toggle-password" data-target="confirm-password">
              <i class="fa-regular fa-eye-slash"></i>
            </span>
          </div>
          <button type="submit" class="btn-primary">Registrarse</button>
          <div id="registerError" class="error-msg"></div>
        </form>
        <p class="terms">
          Al registrarte, aceptas nuestras <a href="#">Condiciones</a>, la <a href="#">Política de privacidad</a> y la <a href="#">Política de cookies</a>.
        </p>
      </div>
      <div class="login-card">
        <p>¿Ya tienes una cuenta? <a href="index.html" class="link-login">Inicia sesión</a></p>
      </div>
      <div class="app-badges">
        <p>Descarga la aplicación.</p>
        <div class="badges-row">
          <button class="badge" onclick="window.open('https://apps.apple.com/app/instagram/id389801252','_blank')">App Store</button>
          <button class="badge" onclick="window.open('https://play.google.com/store/apps/details?id=com.instagram.android','_blank')">Google Play</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="../js/toggle-password.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
