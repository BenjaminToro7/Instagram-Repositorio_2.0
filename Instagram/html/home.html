<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/home.css">
</head>
<body>
    <nav class="sidebar">
        <div class="logo-link">
            <span class="logo-text">Instagram</span>
            <span class="logo-icon"><i class="fa-brands fa-instagram"></i></span>
        </div>
        <div class="nav-items">
            <a href="home.html" class="nav-item active"><i class="fa-solid fa-house"></i><span>Inicio</span></a>
            <div class="nav-item" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i><span>Buscar</span></div>
            <a href="reels.html" class="nav-item"><i class="fa-solid fa-clapperboard"></i><span>Reels</span></a>
            <a href="messages.html" class="nav-item"><i class="fa-regular fa-paper-plane"></i><span>Mensajes</span></a>
            <a href="notifications.html" class="nav-item"><i class="fa-regular fa-heart"></i><span>Notificaciones</span></a>
            <a href="profile.html" class="nav-item" id="profileNavItem"><img class="avatar-xs" id="navAvatar" src="" alt=""><span>Perfil</span></a>
        </div>
    </nav>
    <main class="main-content">
        <div class="feed-container">
            <div class="feed-wrapper">
                <section class="stories" id="storiesSection"></section>
                <section class="feed" id="feedSection"></section>
            </div>
        </div>
    </main>

    <!-- Post Detail Modal -->
    <div class="modal-overlay" id="postModal">
        <div class="modal-box post-modal-content" style="display:flex;max-width:900px;width:90vw;max-height:90vh;overflow:hidden;background:#000;border-radius:16px;">
            <button class="modal-close" id="closePostModalBtn">&times;</button>
            <div class="post-modal-left" style="flex:1;background:#000;display:flex;align-items:center;justify-content:center;min-height:400px;max-height:90vh;overflow:hidden;">
                <div id="postModalMedia" style="max-width:100%;max-height:100%;"></div>
            </div>
            <div class="post-modal-right" style="width:400px;display:flex;flex-direction:column;border-left:1px solid #262626;">
                <div class="post-modal-header" style="display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid #262626;">
                    <img id="postModalAvatar" src="" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">
                    <span id="postModalUsername" style="font-weight:600;font-size:14px;"></span>
                </div>
                <div class="post-modal-comments" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;">
                    <div id="postModalCaption" style="font-size:14px;display:flex;gap:8px;">
                        <strong id="postModalCaptionUser"></strong>
                        <span id="postModalCaptionText"></span>
                    </div>
                    <div id="postModalCommentsList"></div>
                </div>
                <div class="post-modal-actions" style="padding:12px 16px;border-top:1px solid #262626;">
                    <div style="display:flex;gap:16px;margin-bottom:8px;">
                        <button class="action-btn" id="postModalLikeBtn"><i class="fa-regular fa-heart" style="font-size:24px;color:#fff;"></i></button>
                        <button class="action-btn"><i class="fa-regular fa-comment" style="font-size:24px;color:#fff;"></i></button>
                        <button class="action-btn"><i class="fa-regular fa-paper-plane" style="font-size:24px;color:#fff;"></i></button>
                    </div>
                    <div id="postModalLikes" style="font-weight:600;font-size:14px;margin-bottom:4px;"></div>
                    <div id="postModalTime" style="font-size:10px;color:#a8a8a8;margin-bottom:8px;"></div>
                    <div style="display:flex;gap:8px;border-top:1px solid #262626;padding-top:12px;">
                        <input type="text" id="postModalCommentInput" placeholder="Agrega un comentario..." style="flex:1;background:none;border:none;color:#fff;font-size:14px;outline:none;">
                        <button id="postModalCommentBtn" style="background:none;border:none;color:#0095f6;font-weight:600;cursor:pointer;">Publicar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="../js/home.js"></script>
</body>
</html>
