<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar - Instagram</title>
    <link rel="stylesheet" href="../css/search.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <!-- BARRA LATERAL IZQUIERDA -->
    <nav class="sidebar">
        <div class="logo">
            <i class="fa-brands fa-instagram"></i>
        </div>
        <div class="menu">
            <a href="home.html"><i class="fa-solid fa-house"></i></a>
            <a href="search.html" class="activo"><i class="fa-solid fa-magnifying-glass"></i></a>
            <a href="reels.html"><i class="fa-solid fa-clapperboard"></i></a>
            <a href="messages.html"><i class="fa-solid fa-paper-plane"></i></a>
            <a href="notifications.html"><i class="fa-regular fa-heart"></i></a>
            <a href="profile.html"><i class="fa-regular fa-user"></i></a>
        </div>
        <div class="menuInferior">
            <i class="fa-solid fa-bars"></i>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="search-container">
        <div class="search-header">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Buscar usuarios...">
            </div>
        </div>

        <!-- Aquí se mostrarán los resultados (explore por defecto, o usuarios encontrados) -->
        <div id="resultados" class="resultados-grid">
            <!-- El JS llenará esto con imágenes y videos al cargar -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
